<div class="cart container mt-5">
  <h2 class="cart-title mb-4">Your Shopping Cart</h2>

  <div *ngIf="cartItems.length === 0" class="empty-cart text-center py-5">
    <i class="fas fa-shopping-cart fa-3x mb-3"></i>
    <p>Your cart is empty!</p>
    <a routerLink="/products" class="btn btn-primary mt-2">Continue Shopping</a>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-items">

    <div class="cart-item row align-items-center mb-3" *ngFor="let item of cartItems; let i = index">
      <div class="col-3 col-md-2">
        <img [src]="item.image" [alt]="item.title" class="item-image">
      </div>

      <div class="col-5 col-md-6">
        <h5 class="item-title">{{ item.title }}</h5>
        <p class="item-price">EGP {{ item.price }}</p>
      </div>

      <div class="col-2 d-flex align-items-center">
        <input type="number"
       min="1"
       [(ngModel)]="item.quantity"
       (ngModelChange)="updateQuantity(item, $event)"
       class="form-control quantity-input">
      </div>

      <div class="col-2 d-flex align-items-center justify-content-end">
        <button (click)="removeItem(item)" class="btn btn-danger btn-sm" >
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>

    <!-- Cart Summary -->
    <div class="cart-summary mt-4 p-3 rounded shadow-sm">
      <h4>Total: EGP {{getAllPrice() | number: '0.1-1'}} </h4>
      <div class="mt-3 d-flex gap-2 flex-wrap">
        <button class="btn btn-success">Proceed to Checkout</button>
        <a routerLink="/products" class="btn btn-outline-primary">Continue Shopping</a>
      </div>
    </div>

  </div>
</div>
