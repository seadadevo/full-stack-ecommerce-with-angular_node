<div class="checkout-wrapper">
<div class="shipping-container">
      <form class="shipping-form">
        
        <h2 class="form-title">Shipping Address</h2>
        
        <div class="form-group">
          <label for="address-details">Details</label>
          <textarea id="address-details" rows="4" placeholder="Enter your full address details (street, building, etc.)"></textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="+20 10 1234 5678">
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="Cairo, Giza, Alexandria...">
          </div>
        </div>
        
        <button type="submit" class="btn-proceed">Proceed to Payment</button>
      
      </form>
    </div>
    </div>
