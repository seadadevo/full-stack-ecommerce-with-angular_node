<div class="cart container mt-5">
  <h2 class="cart-title mb-4">Your Favourite List</h2>

  <div *ngIf="favouriteItems.length === 0" class="empty-cart text-center py-5">
    <i class="fas fa-heart-broken fa-3x mb-3 text-muted"></i>
    <p>Your favourites list is empty!</p>
    <a routerLink="/products" class="btn btn-primary mt-2">Find Products</a>
  </div>

  <div *ngIf="favouriteItems.length > 0" class="cart-items">

    <div class="cart-item row align-items-center mb-3" *ngFor="let item of favouriteItems; let i = index">
      
      <div class="col-3 col-md-2">
        <img [src]="item.image" [alt]="item.title" class="item-image">
      </div>

      <div class="col-5 col-md-8">
        <h5 class="item-title">{{ item.title }}</h5>
        <p class="item-price h5 text-primary fw-bold">{{ item.price | currency:'EGP' }}</p>
      </div>

      <div class="col-4 col-md-2 d-flex align-items-center justify-content-end">
        <button (click)="removeToFavouriteList(item)" class="btn btn-danger btn-sm" >
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>

</div>
